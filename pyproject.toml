[project]
name = "tradesim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "jinja2>=3.1.6",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "typer>=0.29.1",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "backtesting>=0.6.6",
    "pytest>=9.2.0",
]

[project.scripts]
tsim = "tradesim.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
