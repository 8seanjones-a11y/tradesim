# Where market data lives. Override with env var TRADESIM_DATA_DIR.
data_dir: ~/tradesim-data
runs_dir: runs

# Default execution assumptions (can be overridden per run)
slippage_ticks: 1          # adverse ticks on market / stop fills
initial_capital: 100000
risk_free_rate: 0.0        # annual; cash interest is not modelled, so 0 keeps Sharpe honest

monte_carlo:
  n_sims: 5000
  seed: 42

# Personal-account ("open market") evaluation
account:
  ruin_drawdown: 0.5       # fraction of capital lost = "ruin"
  dd_tolerance: 0.2        # max DD you'd accept; used for "capital needed"
  horizons_years: [1, 3, 5]

# Reports: "cdn" (small files, needs internet to view charts) or "inline" (~5 MB, fully offline)
report_plotly: cdn
